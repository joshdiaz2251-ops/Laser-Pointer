<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  body {
    font-family: system-ui, sans-serif;
    background: #111;
    color: #eee;
    padding: 30px;
    text-align: center;
  }
  h1 { font-size: 22px; margin-bottom: 8px; }
  p.sub {
    color: #999;
    font-size: 14px;
    margin-bottom: 28px;
  }
  button {
    width: 100%;
    padding: 22px;
    border: none;
    border-radius: 12px;
    background: #d02c2c;
    color: white;
    font-size: 22px;
    font-weight: bold;
    cursor: pointer;
  }
  button:disabled { background: #555; cursor: default; }
  button:hover:not(:disabled) { background: #e63939; }
  #status {
    margin-top: 24px;
    font-size: 16px;
    color: #9ad19a;
    white-space: pre-line;
    line-height: 1.5;
  }
  #status.error { color: #ff8080; }
  .step {
    font-size: 40px;
    margin-bottom: 10px;
  }
  #codeBox {
    margin-bottom: 24px;
    padding: 16px;
    border-radius: 10px;
    background: #1b1b1b;
    border: 1px solid #333;
  }
  #codeBox .label {
    font-size: 12px;
    color: #999;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  #codeValue {
    font-size: 26px;
    font-weight: bold;
    color: #ffd166;
    margin: 6px 0;
    word-break: break-all;
  }
</style>
</head>
<body>
  <div class="step">🔴</div>
  <h1>Share My Screen</h1>
  <p class="sub">Click the big button, then pick your screen when Windows asks.</p>

  <div id="codeBox">
    <div class="label">Tell your friend this code</div>
    <div id="codeValue"></div>
  </div>

  <button id="connectBtn">CLICK HERE TO START</button>

  <div id="status">Ready. Just click the button above.</div>

  <script src="wordlist.js"></script>
  <script>
    // Hardcoded so there is nothing for a non-technical user to type or get wrong.
    const SERVER_URL = "wss://laser-pointer-c12c.onrender.com";
    const ROOM_CODE = generateRoomCode();
    document.getElementById("codeValue").textContent = ROOM_CODE;

    const connectBtn = document.getElementById("connectBtn");
    const statusEl = document.getElementById("status");

    function setStatus(text, isError) {
      statusEl.textContent = text;
      statusEl.className = isError ? "error" : "";
    }

    let ws = null;
    let pc = null;
    let dataChannel = null;

    connectBtn.addEventListener("click", async () => {
      connectBtn.disabled = true;
      connectBtn.textContent = "Starting...";
      setStatus("A window will pop up asking which screen to share.\nPick your main screen and click Share.");

      let stream;
      try {
        stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
      } catch (err) {
        setStatus("Screen share was cancelled. Click the button again to retry.", true);
        connectBtn.disabled = false;
        connectBtn.textContent = "CLICK HERE TO START";
        return;
      }

      setStatus("Connecting...");
      ws = new WebSocket(SERVER_URL);

      ws.addEventListener("open", () => {
        ws.send(JSON.stringify({ type: "join", room: ROOM_CODE }));
        setStatus("Waiting for your friend to connect...\n(This can take up to a minute the first time.)");
        startPeerConnection(stream);
      });

      ws.addEventListener("message", async (event) => {
        const msg = JSON.parse(event.data);
        if (msg.type === "viewer-ready") {
          if (pc.signalingState === "stable" && pc.connectionState !== "connected") {
            await makeOffer();
          }
        } else if (msg.type === "answer") {
          await pc.setRemoteDescription(new RTCSessionDescription(msg.answer));
        } else if (msg.type === "ice") {
          try {
            await pc.addIceCandidate(msg.candidate);
          } catch {}
        }
      });

      ws.addEventListener("close", () => {
        setStatus("Lost connection to the server. Click the button again to retry.", true);
        connectBtn.disabled = false;
        connectBtn.textContent = "CLICK HERE TO START";
      });
      ws.addEventListener("error", () => {
        setStatus("Something went wrong connecting. Click the button again to retry.", true);
        connectBtn.disabled = false;
        connectBtn.textContent = "CLICK HERE TO START";
      });
    });

    function startPeerConnection(stream) {
      pc = new RTCPeerConnection({
        iceServers: [
          { urls: "stun:stun.l.google.com:19302" },
          {
            urls: [
              "turn:openrelay.metered.ca:80",
              "turn:openrelay.metered.ca:443",
              "turn:openrelay.metered.ca:443?transport=tcp",
            ],
            username: "openrelayproject",
            credential: "openrelayproject",
          },
        ],
      });

      for (const track of stream.getTracks()) {
        pc.addTrack(track, stream);
      }

      dataChannel = pc.createDataChannel("pointer");
      dataChannel.addEventListener("message", (event) => {
        const payload = JSON.parse(event.data);
        window.pointerBridge.send(payload);
      });

      pc.addEventListener("icecandidate", (event) => {
        if (event.candidate && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: "ice", candidate: event.candidate }));
        }
      });

      pc.addEventListener("connectionstatechange", () => {
        if (pc.connectionState === "connected") {
          connectBtn.textContent = "CONNECTED ✓";
          setStatus("You're all set! Your friend can now point on your screen.\nYou can minimize this window.");
        } else if (["failed", "disconnected", "closed"].includes(pc.connectionState)) {
          setStatus("Connection " + pc.connectionState + ". Click the button again to retry.", true);
          connectBtn.disabled = false;
          connectBtn.textContent = "CLICK HERE TO START";
        }
      });

      stream.getVideoTracks()[0].addEventListener("ended", () => {
        setStatus("Screen sharing stopped. Click the button again to restart.", true);
        connectBtn.disabled = false;
        connectBtn.textContent = "CLICK HERE TO START";
      });
    }

    async function makeOffer() {
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      ws.send(JSON.stringify({ type: "offer", offer }));
    }
  </script>
</body>
</html>
