<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }
  canvas {
    display: block;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener("resize", resize);
  resize();

  const TRAIL_LENGTH = 10;
  const TRAIL_FADE_MS = 250;
  let trail = []; // [{x, y, t}], newest last
  let visible = false;

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const now = performance.now();
    trail = trail.filter((p) => now - p.t < TRAIL_FADE_MS);

    for (let i = 0; i < trail.length; i++) {
      const p = trail[i];
      const age = (now - p.t) / TRAIL_FADE_MS; // 0 = fresh, 1 = fully faded
      const alpha = 1 - age;
      const radius = 6 * (1 - age * 0.5);

      ctx.fillStyle = `rgba(230,0,0,${alpha})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
      ctx.fill();
    }

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);

  window.pointerBridge.onUpdate((payload) => {
    if (!payload || payload.visible === false) {
      visible = false;
      trail = [];
      return;
    }
    visible = true;
    trail.push({
      x: payload.x * canvas.width,
      y: payload.y * canvas.height,
      t: performance.now(),
    });
    if (trail.length > TRAIL_LENGTH) trail.shift();
  });
</script>
</body>
</html>
